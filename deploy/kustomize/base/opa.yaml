apiVersion: v1
kind: ConfigMap
metadata: {name: opa-policy-bundle}
immutable: true
data:
  blueeconomy_http.rego: |
    package blueeconomy.http
    import rego.v1
    default allow := false
    allow if { input.subject.sub != ""; startswith(input.subject.tenant_id, "tenant-"); input.subject.aud == "blueeconomy-api"; input.resource.tenant_id == input.subject.tenant_id; not input.request.headers["x-tenant-id"] }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: opa}
spec:
  replicas: 3
  selector: {matchLabels: {app: opa}}
  template:
    metadata: {labels: {app: opa}}
    spec:
      serviceAccountName: platform-runtime
      containers:
      - name: opa
        image: openpolicyagent/opa:${OPA_IMAGE_TAG}
        args: ["run", "--server", "--addr=:8181", "/policies"]
        ports: [{containerPort: 8181, name: http}]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
        readinessProbe: {httpGet: {path: /health, port: http}}
        resources: {requests: {cpu: "100m", memory: "128Mi"}, limits: {cpu: "500m", memory: "256Mi"}}
        volumeMounts: [{name: policies, mountPath: /policies, readOnly: true}]
      volumes: [{name: policies, configMap: {name: opa-policy-bundle}}]
---
apiVersion: v1
kind: Service
metadata: {name: opa}
spec: {selector: {app: opa}, ports: [{name: http, port: 8181, targetPort: http}]}
