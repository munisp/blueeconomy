apiVersion: apps/v1
kind: StatefulSet
metadata: {name: keycloak}
spec:
  serviceName: keycloak
  replicas: 2
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata: {labels: {app: keycloak}}
    spec:
      serviceAccountName: platform-runtime
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:${KEYCLOAK_IMAGE_TAG}
        args: ["start", "--optimized", "--proxy-headers=xforwarded", "--hostname-strict=true"]
        ports: [{containerPort: 8080, name: http}]
        envFrom: [{secretRef: {name: keycloak-runtime-secrets}}]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: ["ALL"]}}
        resources: {requests: {cpu: "1", memory: "1Gi"}, limits: {cpu: "2", memory: "2Gi"}}
---
apiVersion: v1
kind: Service
metadata: {name: keycloak}
spec: {selector: {app: keycloak}, ports: [{name: http, port: 8080, targetPort: http}]}
