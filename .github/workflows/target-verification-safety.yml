name: Target Verification Safety

on:
  pull_request:
    paths:
      - 'integration/target-verification/**'
      - '.github/workflows/target-verification-safety.yml'
  push:
    branches:
      - main
    paths:
      - 'integration/target-verification/**'
      - '.github/workflows/target-verification-safety.yml'

permissions:
  contents: read

concurrency:
  group: target-verification-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Verify target-test controls without target access
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate shell syntax
        run: |
          for script in integration/target-verification/lib/target_test_common.sh \
            integration/target-verification/run-maritime-feed-target-tests.sh \
            integration/target-verification/run-regulated-payment-target-tests.sh \
            integration/target-verification/validate-target-acceptance-readiness.sh \
            integration/target-verification/validate-target-evidence-bundle.sh \
            integration/target-verification/validate-maritime-feed-dr-evidence.sh \
            integration/target-verification/validate-protected-promotion-closeout-attestation.sh \
            integration/target-verification/test-protected-promotion-closeout-attestation.sh; do
            bash -n "$script"
          done

      - name: Validate closeout-attestation structural controls without approval
        run: |
          set -euo pipefail
          jq -e '(."$schema" | type == "string") and .properties.schema_version.const == "blueeconomy.protected-promotion-closeout.v1"' \
            integration/target-verification/schemas/blueeconomy.protected-promotion-closeout.v1.schema.json
          jq -e '(."$schema" | type == "string") and .properties.schema_version.const == "blueeconomy.gitops-deployment-identity.v1"' \
            integration/target-verification/schemas/blueeconomy.gitops-deployment-identity.v1.schema.json
          root="$PWD"
          "$root/integration/target-verification/validate-protected-promotion-closeout-attestation.sh" \
            --attestation "$root/integration/target-verification/examples/protected-promotion-closeout.template.json" \
            --mode template > closeout-template-validation.json
          "$root/integration/target-verification/validate-protected-promotion-closeout-attestation.sh" \
            --attestation "$root/integration/target-verification/examples/protected-promotion-closeout.pending-candidate.example.json" \
            --mode candidate > closeout-candidate-validation.json
          jq -e '.cryptographic_signature_verified == false and .ministry_approval_established == false' closeout-template-validation.json
          jq -e '.cryptographic_signature_verified == false and .ministry_approval_established == false' closeout-candidate-validation.json
          integration/target-verification/test-protected-promotion-closeout-attestation.sh
          python3 -m py_compile \
            integration/target-verification/reconcile_gitops_deployment_identity.py \
            integration/target-verification/test_reconcile_gitops_deployment_identity.py
          python3 integration/target-verification/test_reconcile_gitops_deployment_identity.py

      - name: Enumerate approved cases without execution
        run: |
          integration/target-verification/run-maritime-feed-target-tests.sh --dry-run
          integration/target-verification/run-regulated-payment-target-tests.sh --dry-run

      - name: Publish redacted readiness report
        run: |
          integration/target-verification/validate-target-acceptance-readiness.sh --format json > target-acceptance-readiness.json
          jq -e '.target_contacted == false and .target_mutated == false and .secret_values_read == false' target-acceptance-readiness.json
          cat target-acceptance-readiness.json
