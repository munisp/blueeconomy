name: Assurance Claim Coverage

on:
  pull_request:
    paths:
      - 'assurance/**'
      - 'scripts/validate_feature_claim_manifest.py'
      - 'scripts/evaluate_release_decision.py'
      - '.github/workflows/assurance-claim-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'assurance/**'
      - 'scripts/validate_feature_claim_manifest.py'
      - 'scripts/evaluate_release_decision.py'
      - '.github/workflows/assurance-claim-coverage.yml'

permissions:
  contents: read

concurrency:
  group: assurance-claim-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Assurance Claim Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate claim manifest structure
        run: python3 scripts/validate_feature_claim_manifest.py
      - name: Emit fail-closed release decision
        run: |
          set -euo pipefail
          if python3 scripts/evaluate_release_decision.py > release-decision.json; then
            jq -e '.decision == "RELEASEABLE" and .blocker_count == 0' release-decision.json
          else
            status=$?
            test "$status" -eq 2
            jq -e '.decision == "NOT_RELEASEABLE" and .blocker_count > 0' release-decision.json
            cat release-decision.json
          fi

